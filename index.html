<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kryštof Marval CV</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      object {
        display: block;
        width: 100vw;
        height: 100vh;
        border: 0;
      }

      .fallback {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .actions a {
        text-decoration: none;
        border: 1px solid #1d4ed8;
        color: #1d4ed8;
        padding: 8px 12px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <object data="marval_krystof_cv.pdf#view=FitH" type="application/pdf">
      <div class="fallback">
        <h1>PDF preview is not supported on this device.</h1>
        <p>You can still open or download the CV below.</p>
        <div class="actions">
          <a href="marval_krystof_cv.pdf" target="_blank" rel="noopener">Open PDF</a>
          <a href="marval_krystof_cv.pdf" download>Download PDF</a>
        </div>
      </div>
    </object>
  </body>
</html>
